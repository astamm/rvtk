name: Build VTK Static Libraries

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      vtk_version:
        description: 'VTK version to build (override default)'
        required: false
        default: ''
      force_rebuild:
        description: 'Force rebuild even if cache exists (bust cache)'
        required: false
        type: boolean
        default: false

env:
  VTK_VERSION: '9.7.2'

jobs:
  # ── Windows: x86_64-w64-mingw32.static.posix (Rtools45 R-package toolchain) ─
  build-windows:
    name: Windows (static-posix-x64)
    runs-on: windows-latest
    env:
      MSYSTEM: UCRT64      # bash session init; cmake/ninja come from ucrt64
      CHERE_INVOKING: '1'
    defaults:
      run:
        shell: C:\rtools45\usr\bin\bash.exe --login -eo pipefail {0}
    steps:
      - uses: actions/checkout@v6

      - name: Set up R and Rtools45
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'
          rtools-version: '45'
        # r-lib/actions uses pwsh internally — that's fine; our run steps use bash

      - name: Restore build cache
        id: cache
        uses: actions/cache@v5
        with:
          path: install
          key: vtk-${{ env.VTK_VERSION }}-windows-static-posix-x64${{ inputs.force_rebuild == 'true' && format('-bust-{0}', github.run_id) || '' }}

      - name: Install build tools via pacman (cmake + ninja only; compiler from static.posix)
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          pacman -Sy --noconfirm --needed \
            mingw-w64-ucrt-x86_64-cmake \
            mingw-w64-ucrt-x86_64-ninja
          # ucrt64: cmake + ninja; static.posix: gcc/g++/as/ar/ranlib
          echo "export PATH=/x86_64-w64-mingw32.static.posix/bin:/ucrt64/bin:\$PATH" >> ~/.bash_profile

      - name: Download VTK source
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          VER="${{ env.VTK_VERSION }}"
          MINOR="${VER%.*}"
          URL="https://www.vtk.org/files/release/${MINOR}/VTK-${VER}.tar.gz"
          echo "Downloading $URL"
          curl -fsSL "$URL" -o vtk-src.tar.gz
          tar -xzf vtk-src.tar.gz

      - name: Configure VTK
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          VER="${{ env.VTK_VERSION }}"
          # x86_64-w64-mingw32.static.posix — the toolchain used by R CMD INSTALL
          # on CRAN/Rtools45.  Using it ensures symbols match what downstream
          # packages expect (no __imp_* DLL-import stubs, no UCRT-only symbols).
          # Ensure the static.posix toolchain (gcc, g++, as, ar, ranlib …) is
          # on PATH so gcc can exec its helper tools (as, ld, …) by name.
          export PATH="/x86_64-w64-mingw32.static.posix/bin:${PATH}"
          TCHAIN=/x86_64-w64-mingw32.static.posix/bin
          export CC="${TCHAIN}/gcc"
          export CXX="${TCHAIN}/g++"
          export AR="${TCHAIN}/ar"
          export RANLIB="${TCHAIN}/ranlib"
          mkdir -p build install
          INSTALL_PREFIX="$(cygpath -w "$(pwd)/install")"
          cd build
          # VTK_IOGeometry requires FiltersHybrid -> RenderingCore. RenderingCore
          # is GL-free; the windowing interactor (RenderingUI) is disabled for
          # this headless build.
          cmake -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="${INSTALL_PREFIX}" \
            -DBUILD_SHARED_LIBS=OFF \
            -DVTK_BUILD_ALL_MODULES=OFF \
            -DVTK_MODULE_ENABLE_VTK_IOLegacy=YES \
            -DVTK_MODULE_ENABLE_VTK_IOXML=YES \
            -DVTK_MODULE_ENABLE_VTK_IOCore=YES \
            -DVTK_MODULE_ENABLE_VTK_CommonCore=YES \
            -DVTK_MODULE_ENABLE_VTK_CommonDataModel=YES \
            -DVTK_MODULE_ENABLE_VTK_IOGeometry=YES \
            -DVTK_MODULE_ENABLE_VTK_FiltersCore=YES \
            -DVTK_MODULE_ENABLE_VTK_FiltersGeneral=YES \
            -DVTK_MODULE_ENABLE_VTK_FiltersGeometry=YES \
            -DVTK_MODULE_ENABLE_VTK_FiltersModeling=YES \
            -DVTK_MODULE_ENABLE_VTK_FiltersExtraction=YES \
            -DVTK_MODULE_ENABLE_VTK_ParallelDIY=YES \
            -DVTK_MODULE_ENABLE_VTK_ParallelCore=YES \
            -DVTK_MODULE_ENABLE_VTK_FiltersHyperTree=YES \
            -DVTK_MODULE_ENABLE_VTK_FiltersStatistics=YES \
            -DVTK_MODULE_ENABLE_VTK_IOCellGrid=YES \
            -DVTK_MODULE_ENABLE_VTK_FiltersCellGrid=YES \
            -DVTK_MODULE_ENABLE_VTK_IONetCDF=NO \
            -DVTK_MODULE_ENABLE_VTK_IOHDF=NO \
            -DVTK_MODULE_ENABLE_VTK_GeovisCore=NO \
            -DVTK_MODULE_ENABLE_VTK_RenderingCore=YES \
            -DVTK_MODULE_ENABLE_VTK_RenderingUI=NO \
            -DVTK_MODULE_ENABLE_VTK_netcdf=NO \
            -DVTK_MODULE_ENABLE_VTK_libproj=NO \
            -DVTK_MODULE_USE_EXTERNAL_VTK_netcdf=OFF \
            -DVTK_MODULE_USE_EXTERNAL_VTK_libproj=NO \
            -DCMAKE_POSITION_INDEPENDENT_CODE=ON \
            -DH5_HAVE_VASPRINTF:INTERNAL=0 \
            ../VTK-${VER}

      - name: Build and install VTK
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          cd build
          ninja -j$(nproc)
          ninja install

      - name: Package archive
        run: |
          VER="${{ env.VTK_VERSION }}"
          MINOR="${VER%.*}"
          PKG="vtk-${VER}-static-posix-x64"
          mkdir -p "${PKG}/include/vtk-${MINOR}" "${PKG}/lib"
          # Headers
          SRC_INC=$(find install/include -maxdepth 1 -name "vtk-*" -type d | sort -V | tail -1)
          if [ -n "${SRC_INC}" ]; then
            cp -R "${SRC_INC}/"* "${PKG}/include/vtk-${MINOR}/"
          fi
          # Static libraries
          find install/lib -name "*.a" -exec cp {} "${PKG}/lib/" \;
          # Third-party license notices (all bundled components; see tools/prebuilt-licenses/README.md)
          cp -R tools/prebuilt-licenses "${PKG}/licenses"
          zip -r "${PKG}.zip" "${PKG}"
          echo "Created ${PKG}.zip"

      - uses: actions/upload-artifact@v7
        with:
          name: vtk-windows-static-posix-x64
          path: vtk-${{ env.VTK_VERSION }}-static-posix-x64.zip
          retention-days: 7

  # ── Windows: shared DLLs with x86_64-w64-mingw32.static.posix (statically-linked runtime) ─
  build-windows-shared:
    name: Windows (shared-posix-x64)
    runs-on: windows-latest
    env:
      MSYSTEM: UCRT64
      CHERE_INVOKING: '1'
    defaults:
      run:
        shell: C:\rtools45\usr\bin\bash.exe --login -eo pipefail {0}
    steps:
      - uses: actions/checkout@v6

      - name: Set up R and Rtools45
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'
          rtools-version: '45'

      - name: Restore build cache
        id: cache
        uses: actions/cache@v5
        with:
          path: install
          key: vtk-${{ env.VTK_VERSION }}-windows-shared-posix-x64${{ inputs.force_rebuild == 'true' && format('-bust-{0}', github.run_id) || '' }}

      - name: Install build tools via pacman (cmake + ninja only)
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          pacman -Sy --noconfirm --needed \
            mingw-w64-ucrt-x86_64-cmake \
            mingw-w64-ucrt-x86_64-ninja
          echo "export PATH=/x86_64-w64-mingw32.static.posix/bin:/ucrt64/bin:\$PATH" >> ~/.bash_profile

      - name: Download VTK source
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          VER="${{ env.VTK_VERSION }}"
          MINOR="${VER%.*}"
          URL="https://www.vtk.org/files/release/${MINOR}/VTK-${VER}.tar.gz"
          echo "Downloading $URL"
          curl -fsSL "$URL" -o vtk-src.tar.gz
          tar -xzf vtk-src.tar.gz

      - name: Configure VTK (shared libs, statically-linked runtime)
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          VER="${{ env.VTK_VERSION }}"
          # Use the same x86_64-w64-mingw32.static.posix toolchain as the static
          # build, but with BUILD_SHARED_LIBS=ON.  The -static-libgcc /
          # -static-libstdc++ flags fold the C++ runtime into each DLL so the
          # resulting DLLs have no dependency on external MSYS2 runtime DLLs
          # (libstdc++-6.dll, libgcc_s_seh-1.dll, libwinpthread-1.dll).
          #
          # Defining the third-party *_EXPORTS macros fixes the shared-build DLL
          # links for VTK 9.7.2's bundled third-party libraries (verdict, jpeg).
          # In a shared build each bundled lib's header flips its export macro to
          # __declspec(dllimport) when the corresponding <lib>_EXPORTS is not
          # defined (e.g. verdict.h's VERDICT_SHARED_LIB + jmorecfg.h's
          # jpeg_EXPORTS gates). dllimport declarations make sibling objects emit
          # __imp_* references that GNU ld's default auto-export does not back
          # with __imp_ thunks, so the DLL link fails with "undefined reference
          # to `__imp_...'". Defining <lib>_EXPORTS flips those to dllexport, so
          # the definitions are exported and intra-DLL calls compile back to
          # direct calls (no __imp_ refs). Set at compile time because
          # CMAKE_WINDOWS_EXPORT_ALL_SYMBOLS does not engage reliably under the
          # Ninja generator for MinGW (no .def is generated).
          #
          # These defines are global (all C/C++ translation units), but that is
          # safe: consumer modules that link against these DLLs then make direct
          # calls that GNU ld's auto-import resolves against the import library
          # (confirmed: vtkFiltersVerdict links cleanly against libvtkverdict).
          #
          # This is a 9.7.2-specific regression: 9.5.2 compiled these headers
          # without the dllimport branch active, so no defines were needed.
          # Bundled libs needing the define in the shared build (from CI):
          #   verdict - C++, verdict.h (VERDICT_SHARED_LIB) -> -Dverdict_EXPORTS
          #   jpeg    - C,    jmorecfg.h (jpeg_EXPORTS)      -> -Djpeg_EXPORTS
          #   tiff    - C,    tiff.h (tiff_EXPORTS)          -> -Dtiff_EXPORTS
          # Other bundled libs linked fine without a define. Each is scoped to the
          # language it compiles as (C vs C++).
          export PATH="/x86_64-w64-mingw32.static.posix/bin:${PATH}"
          TCHAIN=/x86_64-w64-mingw32.static.posix/bin
          export CC="${TCHAIN}/gcc"
          export CXX="${TCHAIN}/g++"
          export AR="${TCHAIN}/ar"
          export RANLIB="${TCHAIN}/ranlib"
          mkdir -p build install
          INSTALL_PREFIX="$(cygpath -w "$(pwd)/install")"
          cd build
          # VTK_IOGeometry requires FiltersHybrid -> RenderingCore. RenderingCore
          # is GL-free; the windowing interactor (RenderingUI) is disabled for
          # this headless build.
          cmake -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="${INSTALL_PREFIX}" \
            -DBUILD_SHARED_LIBS=ON \
            -DCMAKE_C_FLAGS="-fcommon -Djpeg_EXPORTS -Dtiff_EXPORTS" \
            -DCMAKE_CXX_FLAGS="-Dverdict_EXPORTS" \
            -DCMAKE_SHARED_LINKER_FLAGS="-static-libgcc -static-libstdc++" \
            -DVTK_BUILD_ALL_MODULES=OFF \
            -DVTK_MODULE_ENABLE_VTK_IOLegacy=YES \
            -DVTK_MODULE_ENABLE_VTK_IOXML=YES \
            -DVTK_MODULE_ENABLE_VTK_IOCore=YES \
            -DVTK_MODULE_ENABLE_VTK_CommonCore=YES \
            -DVTK_MODULE_ENABLE_VTK_CommonDataModel=YES \
            -DVTK_MODULE_ENABLE_VTK_IOGeometry=YES \
            -DVTK_MODULE_ENABLE_VTK_FiltersCore=YES \
            -DVTK_MODULE_ENABLE_VTK_FiltersGeneral=YES \
            -DVTK_MODULE_ENABLE_VTK_FiltersGeometry=YES \
            -DVTK_MODULE_ENABLE_VTK_FiltersModeling=YES \
            -DVTK_MODULE_ENABLE_VTK_FiltersExtraction=YES \
            -DVTK_MODULE_ENABLE_VTK_ParallelDIY=YES \
            -DVTK_MODULE_ENABLE_VTK_ParallelCore=YES \
            -DVTK_MODULE_ENABLE_VTK_FiltersHyperTree=YES \
            -DVTK_MODULE_ENABLE_VTK_FiltersStatistics=YES \
            -DVTK_MODULE_ENABLE_VTK_IOCellGrid=YES \
            -DVTK_MODULE_ENABLE_VTK_FiltersCellGrid=YES \
            -DVTK_MODULE_ENABLE_VTK_IONetCDF=NO \
            -DVTK_MODULE_ENABLE_VTK_IOHDF=NO \
            -DVTK_MODULE_ENABLE_VTK_GeovisCore=NO \
            -DVTK_MODULE_ENABLE_VTK_RenderingCore=YES \
            -DVTK_MODULE_ENABLE_VTK_RenderingUI=NO \
            -DVTK_MODULE_ENABLE_VTK_netcdf=NO \
            -DVTK_MODULE_ENABLE_VTK_libproj=NO \
            -DVTK_MODULE_USE_EXTERNAL_VTK_netcdf=OFF \
            -DVTK_MODULE_USE_EXTERNAL_VTK_libproj=NO \
            -DCMAKE_POSITION_INDEPENDENT_CODE=ON \
            -DH5_HAVE_VASPRINTF:INTERNAL=0 \
            ../VTK-${VER}

      - name: Build and install VTK
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          cd build
          ninja -j$(nproc)
          ninja install

      - name: Package archive
        run: |
          VER="${{ env.VTK_VERSION }}"
          MINOR="${VER%.*}"
          PKG="vtk-${VER}-shared-posix-x64"
          mkdir -p "${PKG}/include/vtk-${MINOR}" "${PKG}/lib" "${PKG}/bin"
          # Headers (same as static build)
          SRC_INC=$(find install/include -maxdepth 1 -name "vtk-*" -type d | sort -V | tail -1)
          if [ -n "${SRC_INC}" ]; then
            cp -R "${SRC_INC}/"* "${PKG}/include/vtk-${MINOR}/"
          fi
          # Import libs (.dll.a) for link time
          find install/lib -name "*.dll.a" -exec cp {} "${PKG}/lib/" \;
          # DLLs for run time
          find install/bin -name "*.dll" -exec cp {} "${PKG}/bin/" \;
          echo "Import libs: $(find ${PKG}/lib -name '*.dll.a' | wc -l)"
          echo "DLLs:        $(find ${PKG}/bin -name '*.dll'   | wc -l)"
          # Third-party license notices (all bundled components; see tools/prebuilt-licenses/README.md)
          cp -R tools/prebuilt-licenses "${PKG}/licenses"
          zip -r "${PKG}.zip" "${PKG}"
          echo "Created ${PKG}.zip"

      - uses: actions/upload-artifact@v7
        with:
          name: vtk-windows-shared-posix-x64
          path: vtk-${{ env.VTK_VERSION }}-shared-posix-x64.zip
          retention-days: 7

  # ── macOS arm64 ────────────────────────────────────────────────────────────
  build-macos-arm64:
    name: macOS arm64
    runs-on: macos-latest   # Apple silicon runner
    steps:
      - uses: actions/checkout@v6

      - name: Restore build cache
        id: cache
        uses: actions/cache@v5
        with:
          path: install
          key: vtk-${{ env.VTK_VERSION }}-macos-arm64${{ inputs.force_rebuild == 'true' && format('-bust-{0}', github.run_id) || '' }}

      - name: Install cmake + ninja
        if: steps.cache.outputs.cache-hit != 'true'
        run: brew install cmake ninja

      - name: Download VTK source
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          VER="${{ env.VTK_VERSION }}"
          MINOR="${VER%.*}"
          curl -fsSL "https://www.vtk.org/files/release/${MINOR}/VTK-${VER}.tar.gz" -o vtk-src.tar.gz
          tar -xzf vtk-src.tar.gz

      - name: Configure VTK
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          VER="${{ env.VTK_VERSION }}"
          mkdir build && cd build
          cmake -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$PWD/../install" \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=13.0 \
            -DBUILD_SHARED_LIBS=OFF \
            -DVTK_BUILD_ALL_MODULES=OFF \
            -DVTK_MODULE_ENABLE_VTK_IOLegacy=YES \
            -DVTK_MODULE_ENABLE_VTK_IOXML=YES \
            -DVTK_MODULE_ENABLE_VTK_IOCore=YES \
            -DVTK_MODULE_ENABLE_VTK_CommonCore=YES \
            -DVTK_MODULE_ENABLE_VTK_CommonDataModel=YES \
            -DVTK_MODULE_ENABLE_VTK_IOGeometry=YES \
            -DVTK_MODULE_ENABLE_VTK_FiltersCore=YES \
            -DVTK_MODULE_ENABLE_VTK_FiltersGeneral=YES \
            -DVTK_MODULE_ENABLE_VTK_FiltersGeometry=YES \
            -DVTK_MODULE_ENABLE_VTK_FiltersModeling=YES \
            -DVTK_MODULE_ENABLE_VTK_FiltersExtraction=YES \
            -DVTK_MODULE_ENABLE_VTK_ParallelDIY=YES \
            -DVTK_MODULE_ENABLE_VTK_ParallelCore=YES \
            -DVTK_MODULE_ENABLE_VTK_FiltersHyperTree=YES \
            -DVTK_MODULE_ENABLE_VTK_FiltersStatistics=YES \
            -DVTK_MODULE_ENABLE_VTK_IOCellGrid=YES \
            -DVTK_MODULE_ENABLE_VTK_FiltersCellGrid=YES \
            -DCMAKE_POSITION_INDEPENDENT_CODE=ON \
            ../VTK-${VER}

      - name: Build and install VTK
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          cd build
          ninja -j$(sysctl -n hw.logicalcpu)
          ninja install

      # Guard against the #16 regression: an LC_BUILD_VERSION minos >= 26.0
      # (built against the macOS 26 SDK) produces archives that cannot be loaded
      # from a package compiled with clang -stdlib=libc++ on older macOS.
      # Runs unconditionally (even on a cache hit) so a stale cached install
      # built with the old flags cannot ship as a fresh archive.
      - name: Assert macOS deployment target is 13.0
        run: |
          # otool -l dumps LC_BUILD_VERSION (platform + minos) for every member
          # object of every static lib.  Every member must declare minos 13.0,
          # the CMAKE_OSX_DEPLOYMENT_TARGET passed to configure.
          fail=0
          for a in install/lib/*.a; do
            bad=$(otool -l "$a" 2>/dev/null | awk '
              /cmd LC_BUILD_VERSION/ { in_lc = 1 }
              in_lc && /minos/          { if ($2 != "13.0") bad++ }
              in_lc && /sdk/            { in_lc = 0 }
              END { print bad+0 }')
            if [ "$bad" -ne 0 ]; then
              echo "FAIL: $a has $bad member object(s) with minos != 13.0" >&2
              fail=1
            fi
          done
          if [ "$fail" -ne 0 ]; then
            echo "Some archives were built against a newer macOS deployment target" >&2
            echo "than CMAKE_OSX_DEPLOYMENT_TARGET=13.0. Check the CMake configure" >&2
            echo "flags and the SDK on the runner." >&2
            exit 1
          fi
          echo "all $(ls install/lib/*.a | wc -l | tr -d ' ') archives declare minos 13.0"

      - name: Package archive
        run: |
          VER="${{ env.VTK_VERSION }}"
          MINOR="${VER%.*}"
          PKG="vtk-${VER}-darwin-arm64"
          mkdir -p "${PKG}/include/vtk-${MINOR}" "${PKG}/lib"
          # Headers
          SRC_INC=$(find install/include -maxdepth 1 -name "vtk-*" -type d | sort -V | tail -1)
          if [ -n "${SRC_INC}" ]; then
            cp -R "${SRC_INC}/"* "${PKG}/include/vtk-${MINOR}/"
          fi
          # Static libraries
          find install/lib -name "*.a" -exec cp {} "${PKG}/lib/" \;
          # Third-party license notices (all bundled components; see tools/prebuilt-licenses/README.md)
          cp -R tools/prebuilt-licenses "${PKG}/licenses"
          tar -czf "${PKG}.tar.gz" "${PKG}"
          echo "Created ${PKG}.tar.gz"

      - uses: actions/upload-artifact@v7
        with:
          name: vtk-macos-arm64
          path: vtk-${{ env.VTK_VERSION }}-darwin-arm64.tar.gz
          retention-days: 7

  # ── macOS x86_64 ───────────────────────────────────────────────────────────
  build-macos-x86_64:
    name: macOS x86_64
    runs-on: macos-latest     # arm64 runner; cross-compile to x86_64
    steps:
      - uses: actions/checkout@v6

      - name: Restore build cache
        id: cache
        uses: actions/cache@v5
        with:
          path: install
          key: vtk-${{ env.VTK_VERSION }}-macos-x86_64${{ inputs.force_rebuild == 'true' && format('-bust-{0}', github.run_id) || '' }}

      - name: Install cmake + ninja
        if: steps.cache.outputs.cache-hit != 'true'
        run: brew install cmake ninja

      - name: Download VTK source
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          VER="${{ env.VTK_VERSION }}"
          MINOR="${VER%.*}"
          curl -fsSL "https://www.vtk.org/files/release/${MINOR}/VTK-${VER}.tar.gz" -o vtk-src.tar.gz
          tar -xzf vtk-src.tar.gz

      - name: Configure VTK
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          VER="${{ env.VTK_VERSION }}"
          mkdir build && cd build
          cmake -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$PWD/../install" \
            -DCMAKE_OSX_ARCHITECTURES=x86_64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=13.0 \
            -DBUILD_SHARED_LIBS=OFF \
            -DVTK_BUILD_ALL_MODULES=OFF \
            -DVTK_MODULE_ENABLE_VTK_IOLegacy=YES \
            -DVTK_MODULE_ENABLE_VTK_IOXML=YES \
            -DVTK_MODULE_ENABLE_VTK_IOCore=YES \
            -DVTK_MODULE_ENABLE_VTK_CommonCore=YES \
            -DVTK_MODULE_ENABLE_VTK_CommonDataModel=YES \
            -DVTK_MODULE_ENABLE_VTK_IOGeometry=YES \
            -DVTK_MODULE_ENABLE_VTK_FiltersCore=YES \
            -DVTK_MODULE_ENABLE_VTK_FiltersGeneral=YES \
            -DVTK_MODULE_ENABLE_VTK_FiltersGeometry=YES \
            -DVTK_MODULE_ENABLE_VTK_FiltersModeling=YES \
            -DVTK_MODULE_ENABLE_VTK_FiltersExtraction=YES \
            -DVTK_MODULE_ENABLE_VTK_ParallelDIY=YES \
            -DVTK_MODULE_ENABLE_VTK_ParallelCore=YES \
            -DVTK_MODULE_ENABLE_VTK_FiltersHyperTree=YES \
            -DVTK_MODULE_ENABLE_VTK_FiltersStatistics=YES \
            -DVTK_MODULE_ENABLE_VTK_IOCellGrid=YES \
            -DVTK_MODULE_ENABLE_VTK_FiltersCellGrid=YES \
            -DCMAKE_POSITION_INDEPENDENT_CODE=ON \
            ../VTK-${VER}

      - name: Build and install VTK
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          cd build
          ninja -j$(sysctl -n hw.logicalcpu)
          ninja install

      # Guard against the #16 regression: an LC_BUILD_VERSION minos >= 26.0
      # (built against the macOS 26 SDK) produces archives that cannot be loaded
      # from a package compiled with clang -stdlib=libc++ on older macOS.
      # Runs unconditionally (even on a cache hit) so a stale cached install
      # built with the old flags cannot ship as a fresh archive.
      - name: Assert macOS deployment target is 13.0
        run: |
          # otool -l dumps LC_BUILD_VERSION (platform + minos) for every member
          # object of every static lib.  Every member must declare minos 13.0,
          # the CMAKE_OSX_DEPLOYMENT_TARGET passed to configure.
          fail=0
          for a in install/lib/*.a; do
            bad=$(otool -l "$a" 2>/dev/null | awk '
              /cmd LC_BUILD_VERSION/ { in_lc = 1 }
              in_lc && /minos/          { if ($2 != "13.0") bad++ }
              in_lc && /sdk/            { in_lc = 0 }
              END { print bad+0 }')
            if [ "$bad" -ne 0 ]; then
              echo "FAIL: $a has $bad member object(s) with minos != 13.0" >&2
              fail=1
            fi
          done
          if [ "$fail" -ne 0 ]; then
            echo "Some archives were built against a newer macOS deployment target" >&2
            echo "than CMAKE_OSX_DEPLOYMENT_TARGET=13.0. Check the CMake configure" >&2
            echo "flags and the SDK on the runner." >&2
            exit 1
          fi
          echo "all $(ls install/lib/*.a | wc -l | tr -d ' ') archives declare minos 13.0"

      - name: Package archive
        run: |
          VER="${{ env.VTK_VERSION }}"
          MINOR="${VER%.*}"
          PKG="vtk-${VER}-darwin-x86_64"
          mkdir -p "${PKG}/include/vtk-${MINOR}" "${PKG}/lib"
          SRC_INC=$(find install/include -maxdepth 1 -name "vtk-*" -type d | sort -V | tail -1)
          if [ -n "${SRC_INC}" ]; then
            cp -R "${SRC_INC}/"* "${PKG}/include/vtk-${MINOR}/"
          fi
          find install/lib -name "*.a" -exec cp {} "${PKG}/lib/" \;
          # Third-party license notices (all bundled components; see tools/prebuilt-licenses/README.md)
          cp -R tools/prebuilt-licenses "${PKG}/licenses"

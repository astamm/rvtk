  # ── Linux x86_64 ───────────────────────────────────────────────────────────
  build-linux:
    name: Linux x86_64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Restore build cache
        id: cache
        uses: actions/cache@v5
        with:
          path: install
          key: vtk-${{ env.VTK_VERSION }}-linux-x86_64${{ inputs.force_rebuild == 'true' && format('-bust-{0}', github.run_id) || '' }}

      - name: Install build dependencies
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build build-essential libgl1-mesa-dev \
            libxt-dev libxrender-dev libxext-dev

      - name: Download VTK source
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          VER="${{ env.VTK_VERSION }}"
          MINOR="${VER%.*}"
          curl -fsSL "https://www.vtk.org/files/release/${MINOR}/VTK-${VER}.tar.gz" -o vtk-src.tar.gz
          tar -xzf vtk-src.tar.gz

      - name: Configure VTK
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          VER="${{ env.VTK_VERSION }}"
          mkdir build && cd build
          cmake -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$PWD/../install" \
            -DBUILD_SHARED_LIBS=OFF \
            -DVTK_BUILD_ALL_MODULES=OFF \
            -DVTK_MODULE_ENABLE_VTK_IOLegacy=YES \
            -DVTK_MODULE_ENABLE_VTK_IOXML=YES \
            -DVTK_MODULE_ENABLE_VTK_IOCore=YES \
            -DVTK_MODULE_ENABLE_VTK_CommonCore=YES \
            -DVTK_MODULE_ENABLE_VTK_CommonDataModel=YES \
            -DVTK_MODULE_ENABLE_VTK_IOGeometry=YES \
            -DVTK_MODULE_ENABLE_VTK_FiltersCore=YES \
            -DVTK_MODULE_ENABLE_VTK_FiltersGeneral=YES \
            -DVTK_MODULE_ENABLE_VTK_FiltersGeometry=YES \
            -DVTK_MODULE_ENABLE_VTK_FiltersModeling=YES \
            -DVTK_MODULE_ENABLE_VTK_FiltersExtraction=YES \
            -DVTK_MODULE_ENABLE_VTK_ParallelDIY=YES \
            -DVTK_MODULE_ENABLE_VTK_ParallelCore=YES \
            -DVTK_MODULE_ENABLE_VTK_FiltersHyperTree=YES \
            -DVTK_MODULE_ENABLE_VTK_FiltersStatistics=YES \
            -DVTK_MODULE_ENABLE_VTK_IOCellGrid=YES \
            -DVTK_MODULE_ENABLE_VTK_FiltersCellGrid=YES \
            -DCMAKE_POSITION_INDEPENDENT_CODE=ON \
            -DCMAKE_C_FLAGS="-fPIC" \
            -DCMAKE_CXX_FLAGS="-fPIC" \
            ../VTK-${VER}

      - name: Build and install VTK
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          cd build
          ninja -j$(nproc)
          ninja install

      # --whole-archive link check (Linux only).
      #
      # A normal link only pulls the archive members actually referenced by the
      # objects seen so far, so a module whose symbols the bundle no longer
      # provides (or that references a missing peer module) can slip through.
      # -Wl,--whole-archive force-loads EVERY member object of EVERY static lib,
      # so any unresolved `_ZN3vtk*` symbol inside the bundle fails the link.
      # The check asserts the 161-archive set is internally consistent; the only
      # allowed externals are the C/C++ runtime + libc/libm/libdl/libpthread
      # (verified: zero GL/X11/zlib/PNG/jpeg/HDF5/netcdf externals in 9.7.2).
      #
      # Runs unconditionally (even on a cache hit): a missing-module regression
      # stored in the cache must still fail the job.  On a cache hit the earlier
      # dependency-install step is skipped, so make sure a C++ toolchain exists.
      - name: Whole-archive link check (cached or fresh)
        run: |
          set -e
          command -v c++ >/dev/null 2>&1 || {
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends build-essential
          }
          ARCHIVES=$(find install/lib -name '*.a' | sort)
          N=$(printf '%s\n' "$ARCHIVES" | wc -l | tr -d ' ')
          test "$N" -eq 161 || { echo "expected 161 static libs, found $N" >&2; exit 1; }
          # Empty main: --whole-archive pulls every member regardless of needs.
          printf 'int main() { return 0; }\n' > /tmp/wa_check_main.cpp
          c++ -std=c++17 -c /tmp/wa_check_main.cpp -o /tmp/wa_check_main.o
          c++ /tmp/wa_check_main.o \
            -Wl,--whole-archive $ARCHIVES -Wl,--no-whole-archive \
            -lpthread -ldl -lm \
            -o /tmp/wa_check_bin
          echo "whole-archive link of all $N static libs OK"
          rm -f /tmp/wa_check_main.cpp /tmp/wa_check_main.o /tmp/wa_check_bin

      - name: Package archive
        run: |
          VER="${{ env.VTK_VERSION }}"
          MINOR="${VER%.*}"
          PKG="vtk-${VER}-linux-x86_64"
          mkdir -p "${PKG}/include/vtk-${MINOR}" "${PKG}/lib"
          SRC_INC=$(find install/include -maxdepth 1 -name "vtk-*" -type d | sort -V | tail -1)
          if [ -n "${SRC_INC}" ]; then
            cp -R "${SRC_INC}/"* "${PKG}/include/vtk-${MINOR}/"
          fi
          find install/lib -name "*.a" -exec cp {} "${PKG}/lib/" \;
          # Third-party license notices (all bundled components; see tools/prebuilt-licenses/README.md)
          cp -R tools/prebuilt-licenses "${PKG}/licenses"
          tar -czf "${PKG}.tar.gz" "${PKG}"
          echo "Created ${PKG}.tar.gz"

      - uses: actions/upload-artifact@v7
        with:
          name: vtk-linux-x86_64
          path: vtk-${{ env.VTK_VERSION }}-linux-x86_64.tar.gz
          retention-days: 7

  # ── Linux aarch64 ─────────────────────────────────────────────────────────
  build-linux-aarch64:
    name: Linux aarch64
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v6

      - name: Restore build cache

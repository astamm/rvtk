# Workflow: build and check a minimal downstream R package that depends on rvtk.
#
# The downstream package ("rvtktest") is scaffolded from scratch exactly once and
# identical for every matrix leg (usethis::create_package + use_cpp11 + a cpp11
# C++ function that #includes <vtkPolyData.h>). VTK is then attached to that same
# scaffold by two strategies that MUST produce byte-identical configuration:
#
#   attach: manual    – hand-written files following the README "Manual setup"
#                       section: src/Makevars, src/Makevars.win,
#                       tools/configure.R (NULL = full bundled VTK), .gitignore entry.
#   attach: use_rvtk  – the user-facing rvtk::use_rvtk() helper generates the
#                       same files automatically.
#
# The workflow then diffs the use_rvtk() output against the hand-written manual
# reference, so the equivalence the README promises (and rvtk::use_rvtk() encodes)
# is asserted in CI on every leg.
#
# Each VTK supply strategy is exercised per platform:
#   system          – VTK installed by the OS package manager (shared libs)
#   prebuilt-static – rvtk downloads its own pre-built static archives automatically
#   prebuilt-shared – rvtk downloads the shared-DLL pre-built archive (Windows)
#   built-shared    – VTK built from source with BUILD_SHARED_LIBS=ON (macOS/Linux)
#
# Together the prebuilt legs exercise every pre-built archive reachable on
# GitHub-hosted runners: the darwin-arm64, linux-x86_64 and Windows
# static/shared archives. (darwin-x86_64, linux-aarch64 and linux-musl archives
# are not reachable from the hosted runner architectures and are instead
# validated by the build-vtk-libs workflow that produces them.)

on:
  push:
    branches: [main, master]
  pull_request:

name: downstream-check.yaml

permissions: read-all

# ---------------------------------------------------------------------------
# Version pinned in one place so it is trivial to bump.
# Must match the version used by rvtk's own pre-built archive.
# ---------------------------------------------------------------------------
env:
  VTK_VERSION: "9.7.2"
  VTK_SHORT:   "9.7"       # X.Y used for the include directory vtk-X.Y

jobs:
  downstream-check:
    runs-on: ${{ matrix.config.os }}

    name: ${{ matrix.config.os }} (${{ matrix.config.r }}, ${{ matrix.config.attach }}, VTK ${{ matrix.config.vtk }})

    strategy:
      fail-fast: false
      matrix:
        config:
          # ── macOS ──────────────────────────────────────────────────────────────
          - {os: macos-latest,   r: 'release', vtk: 'system',            attach: 'manual'}
          - {os: macos-latest,   r: 'release', vtk: 'system',            attach: 'use_rvtk'}
          - {os: macos-latest,   r: 'release', vtk: 'prebuilt-static',   attach: 'manual'}
          - {os: macos-latest,   r: 'release', vtk: 'prebuilt-static',   attach: 'use_rvtk'}
          - {os: macos-latest,   r: 'release', vtk: 'built-shared',      attach: 'manual'}
          - {os: macos-latest,   r: 'release', vtk: 'built-shared',      attach: 'use_rvtk'}
          # ── Windows ────────────────────────────────────────────────────────────
          - {os: windows-latest, r: 'release', vtk: 'system',            attach: 'manual'}
          - {os: windows-latest, r: 'release', vtk: 'system',            attach: 'use_rvtk'}
          - {os: windows-latest, r: 'release', vtk: 'prebuilt-static',   attach: 'manual'}
          - {os: windows-latest, r: 'release', vtk: 'prebuilt-static',   attach: 'use_rvtk'}
          - {os: windows-latest, r: 'release', vtk: 'prebuilt-shared',   attach: 'manual'}
          - {os: windows-latest, r: 'release', vtk: 'prebuilt-shared',   attach: 'use_rvtk'}
          # ── Linux ──────────────────────────────────────────────────────────────
          - {os: ubuntu-latest,  r: 'release', vtk: 'system',            attach: 'manual'}
          - {os: ubuntu-latest,  r: 'release', vtk: 'system',            attach: 'use_rvtk'}
          - {os: ubuntu-latest,  r: 'release', vtk: 'prebuilt-static',   attach: 'manual'}
          - {os: ubuntu-latest,  r: 'release', vtk: 'prebuilt-static',   attach: 'use_rvtk'}
          - {os: ubuntu-latest,  r: 'release', vtk: 'built-shared',      attach: 'manual'}
          - {os: ubuntu-latest,  r: 'release', vtk: 'built-shared',      attach: 'use_rvtk'}
          # Fedora-clang ABI guard: force the clang + libc++ toolchain via
          # R_MAKEVARS_USER so configure detects libc++ and selects the
          # *-linux-x86_64-libcxx archive, then prove both attach strategies
          # work against it (the equivalence check and the smoke test below).
          # CRAN's r-devel-linux-x86_64-fedora-clang flavor compiles R packages
          # with clang defaulting to libc++, which cannot load a GCC/libstdc++
          # archive (undefined symbol `__try_use_facet` / `__cxa_call_terminate`
          # at dlopen).
          - {os: ubuntu-latest,  r: 'release', vtk: 'prebuilt-static-libcxx', attach: 'manual'}
          - {os: ubuntu-latest,  r: 'release', vtk: 'prebuilt-static-libcxx', attach: 'use_rvtk'}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes

    steps:
      # ── 1. Checkout rvtk itself ───────────────────────────────────────────────
      - uses: actions/checkout@v6
        with:
          path: rvtk

      # ── 2. R setup ───────────────────────────────────────────────────────────
      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          use-public-rspm: true

      # ── 3a. System VTK ───────────────────────────────────────────────────────
      - name: Install system VTK (macOS – Homebrew)
        if: runner.os == 'macOS' && matrix.config.vtk == 'system'
        run: brew install vtk

      - name: Install system VTK (Linux – apt)
        if: runner.os == 'Linux' && matrix.config.vtk == 'system'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libvtk9-dev || sudo apt-get install -y libvtk-dev

      - name: Install system VTK (Windows – Rtools45 pacman)
        if: runner.os == 'Windows' && matrix.config.vtk == 'system'
        shell: bash
        run: pacman -S --noconfirm mingw-w64-ucrt-x86_64-vtk

      # ── 3a-libcxx. clang + libc++ toolchain for the fedora-clang ABI leg ─────
      # Force 'clang++ -stdlib=libc++' for the whole leg via an R_MAKEVARS_USER
      # file (r-lib/actions/setup-r installs R built with GCC on Ubuntu; CRAN's
      # fedora-clang flavor instead compiles packages with clang + libc++).
      # R exports CXX from R_MAKEVARS_USER into configure's environment, which
      # is how rvtk's configure detects libc++ and selects the libcxx archive.
      - name: Install clang + libc++ toolchain
        if: matrix.config.vtk == 'prebuilt-static-libcxx'
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends clang libc++-dev libc++abi-dev
          cat > "$RUNNER_TEMP/Makevars" << 'EOF'
          CXX=clang++ -stdlib=libc++
          CXX11=clang++ -stdlib=libc++
          CXX14=clang++ -stdlib=libc++
          CXX17=clang++ -stdlib=libc++
          CXX20=clang++ -stdlib=libc++
          CC=clang
          EOF
          echo "R_MAKEVARS_USER=$RUNNER_TEMP/Makevars" >> "$GITHUB_ENV"

      # ── 3b. Built VTK with shared libs – restore from cache ──────────────────
      - name: Cache built shared VTK
        if: matrix.config.vtk == 'built-shared'
        id: cache-vtk-shared
        uses: actions/cache@v5
        with:
          path: ~/vtk-shared-install
          # Bump the trailing integer when the CMake options change.
          key: vtk-${{ env.VTK_VERSION }}-shared-${{ runner.os }}-${{ runner.arch }}-v5

      - name: Install build tools for VTK (Linux)
        if: runner.os == 'Linux' && matrix.config.vtk == 'built-shared' && steps.cache-vtk-shared.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y cmake ninja-build libgl1-mesa-dev libxt-dev

      - name: Install build tools for VTK (macOS)
        if: runner.os == 'macOS' && matrix.config.vtk == 'built-shared' && steps.cache-vtk-shared.outputs.cache-hit != 'true'
        run: brew install cmake ninja

      - name: Download VTK source
        if: matrix.config.vtk == 'built-shared' && steps.cache-vtk-shared.outputs.cache-hit != 'true'
        shell: bash
        run: |
          curl -fsSL \
            "https://www.vtk.org/files/release/${{ env.VTK_SHORT }}/VTK-${{ env.VTK_VERSION }}.tar.gz" \
            -o VTK-src.tar.gz
          tar xzf VTK-src.tar.gz

      - name: Configure VTK (shared libs, minimal modules)
        if: matrix.config.vtk == 'built-shared' && steps.cache-vtk-shared.outputs.cache-hit != 'true'
        shell: bash
        run: |
          # IOPLY/IOImage/FiltersSources extra: exercised by the shared
          # vtk_modules_probe() smoke test below, so the built-shared legs must
          # build them too or that probe fails to link.
          cmake -S "VTK-${{ env.VTK_VERSION }}" -B vtk-build \
            -G Ninja \
            -DBUILD_SHARED_LIBS=ON \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$HOME/vtk-shared-install" \
            -DVTK_BUILD_ALL_MODULES=OFF \
            -DVTK_MODULE_ENABLE_VTK_IOLegacy=YES \
            -DVTK_MODULE_ENABLE_VTK_IOXML=YES \
            -DVTK_MODULE_ENABLE_VTK_IOCore=YES \
            -DVTK_MODULE_ENABLE_VTK_CommonCore=YES \
            -DVTK_MODULE_ENABLE_VTK_CommonDataModel=YES \
            -DVTK_MODULE_ENABLE_VTK_IOGeometry=YES \
            -DVTK_MODULE_ENABLE_VTK_FiltersCore=YES \
            -DVTK_MODULE_ENABLE_VTK_FiltersGeneral=YES \
            -DVTK_MODULE_ENABLE_VTK_FiltersGeometry=YES \
            -DVTK_MODULE_ENABLE_VTK_FiltersModeling=YES \
            -DVTK_MODULE_ENABLE_VTK_FiltersExtraction=YES \
            -DVTK_MODULE_ENABLE_VTK_IOPLY=YES \
            -DVTK_MODULE_ENABLE_VTK_IOImage=YES \
            -DVTK_MODULE_ENABLE_VTK_FiltersSources=YES \
            -DCMAKE_POSITION_INDEPENDENT_CODE=ON

      - name: Build and install VTK (shared libs)
        if: matrix.config.vtk == 'built-shared' && steps.cache-vtk-shared.outputs.cache-hit != 'true'
        shell: bash
        run: |
          cmake --build vtk-build --parallel $(getconf _NPROCESSORS_ONLN 2>/dev/null || sysctl -n hw.logicalcpu)
          cmake --install vtk-build

      - name: Expose VTK_DIR for built-shared
        if: matrix.config.vtk == 'built-shared'
        shell: bash
        run: echo "VTK_DIR=$HOME/vtk-shared-install" >> "$GITHUB_ENV"

      # ── 4. Install R packages needed by the build ─────────────────────────────
      # working-directory: rvtk makes setup-r-dependencies read the rvtk
      # DESCRIPTION and install rvtk from local source (no CRAN lookup needed).
      # The extra-packages are installed into the same managed library path,
      # which persists correctly across all subsequent steps on every platform.
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          working-directory: rvtk
          extra-packages: |
            any::rcmdcheck
            any::usethis
            any::withr
            any::cpp11
            any::roxygen2
            any::devtools
            any::decor

      # ── 5. Install rvtk from the checked-out source ───────────────────────────
      #
      # This runs rvtk's own configure script, which detects VTK (system,
      # built-shared via VTK_DIR, or falls back to downloading prebuilt-static)
      # and writes inst/vtk.conf.  Downstream package configuration then reads
      # those flags by calling rvtk::CppFlags() / rvtk::LdFlagsFile().
      # setup-r-dependencies above already installed rvtk from local source,
      # but we reinstall here to ensure it ran configure with the right VTK_DIR.
      - name: Install rvtk from source
        shell: Rscript {0}
        working-directory: rvtk
        env:
          # For the prebuilt-shared strategy, tell winlibs.R to download the
          # shared-DLL build instead of the default static build.
          VTK_LINK_TYPE: ${{ (matrix.config.vtk == 'prebuilt-shared') && 'shared' || '' }}
        run: pak::local_install(upgrade = FALSE)

      # ── 5b. Assert the fedora-clang leg really used the libc++ archive ───────
      # vtk.conf is '='-separated (not DCF); parse it the same way rvtk does.
      - name: Assert rvtk linked the libc++ prebuilt archive
        if: matrix.config.vtk == 'prebuilt-static-libcxx'
        shell: Rscript {0}
        working-directory: rvtk
        run: |
          conf <- rvtk:::read_vtk_conf()
          stdlib <- conf[["VTK_STDLIB"]]
          cat("rvtk VTK_STDLIB:", stdlib, "\n")
          stopifnot(identical(stdlib, "libc++"))
          # Sanity: a libstdc++ archive would have been written as libstdc++.
          prebuilt <- system.file("prebuilt", package = "rvtk")
          if (file.exists(prebuilt)) {
            a <- list.files(file.path(prebuilt, "lib"), pattern = "\\.a$", full.names = TRUE)
            # libvtkscn is the archive that carries the libstdc++-ABI weak refs;
            # it must not reference __try_use_facet / __cxa_call_terminate here.
            scn <- grep("vtkscn", a, value = TRUE)
            if (length(scn)) {
              out <- system2("nm", c("-C", shQuote(scn)), stdout = TRUE)
              bad <- grep("__try_use_facet|__cxa_call_terminate", out, value = TRUE)
              if (length(bad)) {
                cat("libvtkscn still references libstdc++ ABI symbols:\n")
                cat(head(bad, 5), sep = "\n")
                stop("libc++-built archive is contaminated with libstdc++ ABI symbols")
              }
            }
          }
          cat("libc++ archive clean of libstdc++-ABI symbols\n")

      # ── 6. Scaffold the downstream package with usethis ───────────────────────
      #
      # usethis::create_package() gives us a well-formed DESCRIPTION, NAMESPACE
      # skeleton and R/ directory.  usethis::use_cpp11() then:
      #   - adds cpp11 to LinkingTo in DESCRIPTION
      #   - creates src/ with a placeholder cpp file
      #   - runs cpp11::cpp_register() once
      # We then replace the placeholder C++ source with our own VTK smoke-test,
      # add the rvtk import stub, and run cpp11::cpp_register() once more so
      # src/cpp11.cpp and R/cpp11.R reflect our final function.
      - name: Scaffold downstream package (R)
        shell: Rscript {0}
        run: |
          pkg <- file.path(Sys.getenv("RUNNER_TEMP"), "rvtktest")

          # ── create_package ──────────────────────────────────────────────
          usethis::create_package(
            path  = pkg,
            fields = list(
              Title       = "Minimal Package to Test rvtk Integration",
              Description = "A minimal package that links against VTK via rvtk.",
              Version     = "0.0.1",
              License     = "MIT + file LICENSE",
              SystemRequirements = "VTK >= 9.1.0"
            ),
            open  = FALSE,
            rstudio = FALSE
          )

          # ── rvtk in Imports ─────────────────────────────────────────────
          withr::with_dir(pkg, usethis::use_package("rvtk"))

          # ── package-level doc skeleton (adds @keywords internal _PACKAGE) ─
          withr::with_dir(pkg, usethis::use_package_doc())

          # ── cpp11: adds LinkingTo, creates src/, runs cpp_register ──────
          withr::with_dir(pkg, usethis::use_cpp11())

          # ── replace placeholder C++ with our VTK smoke-test ─────────────
          # Remove the example file created by use_cpp11().
          unlink(file.path(pkg, "src", "code.cpp"))

          writeLines(
            c(
              "// vtk_poly_data.cpp - minimal VTK smoke-test via cpp11",
              "",
              "#include <cpp11.hpp>",
              "",
              "// VTK headers under test.",
              "// The set deliberately spans several modules so that the smoke test",
              "// fails (undefined symbol at package load / link time) if a module",
              "// required by the documented rvtk entry points is missing from the",
              "// bundled or system VTK:",
              "//   vtkPolyData        - CommonDataModel",
              "//   vtkPLYReader       - IOPLY",
              "//   vtkPNGReader       - IOImage",
              "//   vtkSphereSource    - FiltersSources",
              "//   vtkExtractGeometry - FiltersExtraction",
              "// (vtkCellGridReader / IOCellGrid is covered by the prebuilt-audit",
              "//  workflow: it is a VTK 9.3 addition missing from Ubuntu 24.04's",
              "//  system VTK 9.1, and every leg here must compile the same source.)",
              "#include <vtkNew.h>",
              "#include <vtkPolyData.h>",
              "#include <vtkPLYReader.h>",
              "#include <vtkPNGReader.h>",
              "#include <vtkSphereSource.h>",
              "#include <vtkExtractGeometry.h>",
              "",
              "[[cpp11::register]]",
              "int vtk_poly_data_npoints() {",
              "  vtkNew<vtkPolyData> pd;",
              "  return static_cast<int>(pd->GetNumberOfPoints());",
              "}",
              "",
              "[[cpp11::register]]",
              "bool vtk_modules_probe() {",
              "  // Exercise one class from each additional module: create the object,",
              "  // touch one method and let the objects destruct.  The compiler/linker",
              "  // only emits code for what is used, so each use below also forces the",
              "  // corresponding vtkXxx::New() symbol to be resolved at link time.",
              "  vtkNew<vtkPLYReader> ply_reader;",
              "  ply_reader->SetFileName(\"unused.ply\");",
              "  vtkNew<vtkPNGReader> png_reader;",
              "  png_reader->SetFileName(\"unused.png\");",
              "  vtkNew<vtkSphereSource> sphere;",
              "  sphere->SetThetaResolution(8);",
              "  vtkNew<vtkExtractGeometry> extract;",
              "  extract->SetExtractInside(true);",
              "  return true;",
              "}"
            ),
            file.path(pkg, "src", "vtk_poly_data.cpp")
          )

          # ── rvtk import stub (silences R CMD check note) ─────────────────
          # roxygen2 will pick up the @importFrom tag and write the NAMESPACE.
          writeLines(
            c("#' @importFrom rvtk CppFlags LdFlagsFile", "NULL"),
            file.path(pkg, "R", "rvtk_imports.R")
          )

          # ── R wrapper for the cpp11 smoke-test with an @export tag ───────
          # cpp11::cpp_register() generates R/cpp11.R from the C++ attributes,
          # but it only copies name/return type/arguments — NOT roxygen tags
          # (cpp11 0.5.5).  The wrapper must live in its own R file with an
          # explicit #' @export so roxygen2 writes export() to NAMESPACE and
          # R CMD check / the smoke test can call rvtktest::vtk_poly_data_npoints().
          writeLines(
            c(
              "#' Number of points in a freshly created vtkPolyData",
              "#'",
              "#' @return Always zero for a new vtkPolyData.",
              "#' @export",
              "vtk_poly_data_npoints <- function() {",
              "  .Call(`_rvtktest_vtk_poly_data_npoints`)",
              "}",
              "",
              "#' Exercise one class per VTK module across the rvtk-supported surface",
              "#'",
              "#' @return TRUE if all classes construct and one method each resolves.",
              "#' @export",
              "vtk_modules_probe <- function() {",
              "  .Call(`_rvtktest_vtk_modules_probe`)",
              "}"
            ),
            file.path(pkg, "R", "vtk_poly_data.R")
          )

          # ── re-register so src/cpp11.cpp + R/cpp11.R match our function ──
          cpp11::cpp_register(pkg)

          # ── propagate PKG_DIR to subsequent steps ────────────────────────
          # devtools::document() is called AFTER VTK is attached (step 7/8) so
          # that it does not attempt to compile the package before src/Makevars
          # is in place.
          cat(sprintf("PKG_DIR=%s\n", pkg), file = Sys.getenv("GITHUB_ENV"), append = TRUE)

      # ── 7. Write the manual VTK-config reference files ───────────────────────
      #
      # These are the exact files the README "Manual setup" section asks a
      # downstream developer to hand-write, and the same files that rvtk::use_rvtk()
      # generates automatically.  They resolve VTK compiler/linker flags at
      # install time by invoking tools/configure.R (which calls rvtk::CppFlags()
      # and rvtk::LdFlagsFile()) via Makevars / Makevars.win — no shell
      # configure script is needed.
      #
      # The files are written to a neutral REF_DIR so every matrix leg can
      # compare its attach strategy against a single hand-written oracle.
      #
      # The reference is generated from R with the SAME content strings and the
      # SAME writeLines() calls rvtk::use_rvtk() uses.  This keeps the reference
      # byte-identical on every platform: R's text-mode writeLines() emits CRLF
      # line endings on Windows and LF elsewhere, exactly matching what
      # use_rvtk() writes through its own writeLines() helper.  A bash printf
      # version would always emit LF and fail the diff on Windows.
      - name: Write manual VTK config reference
        shell: Rscript {0}
        run: |
          ref <- file.path(Sys.getenv("RUNNER_TEMP"), "ref_vtk")
          unlink(ref, recursive = TRUE)
          dir.create(file.path(ref, "src"), recursive = TRUE)
          dir.create(file.path(ref, "tools"), recursive = TRUE)
          cat(sprintf("REF_DIR=%s\n", ref), file = Sys.getenv("GITHUB_ENV"), append = TRUE)

          # Same default as rvtk::use_rvtk(): NULL = full bundled VTK.
          modules <- NULL

          # ---- src/Makevars (mirrors use_rvtk() step 2) -------------------
          writeLines(paste0(
            'PKG_CPPFLAGS = `"$(R_HOME)/bin/Rscript" ../tools/configure.R --cppflags`\n',
            'PKG_LIBS = `"$(R_HOME)/bin/Rscript" ../tools/configure.R --libs`\n'
          ), con = file.path(ref, "src", "Makevars"))

          # ---- src/Makevars.win (mirrors use_rvtk() step 3) ---------------
          writeLines(paste0(
            'PKG_CPPFLAGS = $(shell "$(R_HOME)/bin$(R_ARCH_BIN)/Rscript" ../tools/configure.R --cppflags)\n',
            'PKG_LIBS = $(shell "$(R_HOME)/bin$(R_ARCH_BIN)/Rscript" ../tools/configure.R --libs)\n'
          ), con = file.path(ref, "src", "Makevars.win"))

          # ---- tools/configure.R (mirrors use_rvtk() step 4) --------------
          modules_lines <- if (is.null(modules)) "NULL" else {
            paste0('  "', modules, '"', collapse = ",\n")
          }
          writeLines(paste0(
            'args <- commandArgs(trailingOnly = TRUE)\n',
            'flag <- if (length(args)) args[1L] else "--cppflags"\n',
            '\n',
            'vtk_modules <- ', modules_lines, '\n',
            '\n',
            'if (flag == "--cppflags") {\n',
            '  rvtk::CppFlags()\n',
            '} else if (flag == "--libs") {\n',
            '  rvtk::LdFlagsFile(path = "vtk_libs.rsp", modules = vtk_modules)\n',
            '}\n'
          ), con = file.path(ref, "tools", "configure.R"))

          # ---- .gitignore line appended by both strategies ---------------
          # Same bytes rvtk_use_git_ignore() appends via cat(pattern, "\n", ...).
          cat("src/vtk_libs.rsp\n", file = file.path(ref, "gitignore_line"), sep = "")

      # ── 8. Attach VTK to the downstream package ───────────────────────────────
      #
      # Two strategies, both applied to the SAME from-scratch scaffold and BOTH
      # required to produce the identical configuration described in the README.
      #
      #   manual   – apply the hand-written reference files directly (README
      #              "Manual setup").
      #   use_rvtk – call rvtk::use_rvtk(), which writes the same files itself.
      - name: Attach VTK (manual)
        if: matrix.config.attach == 'manual'
        shell: bash
        run: |
          PKG="$PKG_DIR"
          mkdir -p "$PKG/src" "$PKG/tools"
          cp "$REF_DIR/src/Makevars"      "$PKG/src/Makevars"
          cp "$REF_DIR/src/Makevars.win"  "$PKG/src/Makevars.win"
          cp "$REF_DIR/tools/configure.R" "$PKG/tools/configure.R"
          # Append the .gitignore entry (creating the file if absent), matching
          # rvtk_use_git_ignore().  R/rvtk_imports.R is already provided by the
          # shared scaffold.
          if [ -f "$PKG/.gitignore" ] && [ -n "$(tail -c1 "$PKG/.gitignore")" ]; then
            printf '\n' >> "$PKG/.gitignore"
          fi
          cat "$REF_DIR/gitignore_line" >> "$PKG/.gitignore"

      - name: Attach VTK (use_rvtk)
        if: matrix.config.attach == 'use_rvtk'
        shell: Rscript {0}
        run: |
          rvtk::use_rvtk(path = Sys.getenv("PKG_DIR"))

      # ── 9. Assert the two attach strategies produce identical config ──────────
      #
      # The whole point of documenting both a manual setup and use_rvtk() is that
      # they are interchangeable.  On use_rvtk legs, diff use_rvtk()'s output
      # against the hand-written reference to lock that equivalence into CI.
      - name: Assert use_rvtk matches the manual reference
        if: matrix.config.attach == 'use_rvtk'
        shell: bash
        run: |
          PKG="$PKG_DIR"
          diff -u "$REF_DIR/src/Makevars"      "$PKG/src/Makevars"
          diff -u "$REF_DIR/src/Makevars.win"  "$PKG/src/Makevars.win"
          diff -u "$REF_DIR/tools/configure.R" "$PKG/tools/configure.R"
          # use_rvtk adds src/vtk_libs.rsp to .gitignore via rvtk_use_git_ignore()
          # (strip a trailing CR so Windows CRLF line endings cannot hide the entry)
          sed 's/\r$//' "$PKG/.gitignore" | grep -Fxq "src/vtk_libs.rsp" \
            || { echo "use_rvtk did not add src/vtk_libs.rsp to .gitignore"; exit 1; }
          # use_rvtk writes the roxygen import stub (idempotent with the shared
          # scaffold's, which already exists).
          grep -q "CppFlags LdFlagsFile" "$PKG/R/rvtk_imports.R" \
            || { echo "R/rvtk_imports.R missing the rvtk import tag"; exit 1; }

      # ── 10. Exercise every user-facing rvtk entry point ───────────────────────
      #
      # The installed rvtk is queried directly on every leg, against whichever
      # VTK supply strategy the leg uses: VtkVersion() reports the detected VTK,
      # CppFlags()/LdFlags()/LdFlagsFile() return non-empty flags resolvable
      # against the active VTK tree. use_rvtk() itself is the attach strategy on
      # the use_rvtk legs (and its output is asserted in step 9). The smoke test
      # then loads the built downstream package and runs its cpp11-backed C++
      # function, which only succeeds if the link truly worked.
      - name: Exercise rvtk entry points
        shell: Rscript {0}
        env:
          VTK_DIR: ${{ env.VTK_DIR }}
        run: |
          v <- rvtk::VtkVersion()
          stopifnot(is.character(v), nzchar(v))
          cpp <- rvtk::CppFlags()
          stopifnot(nzchar(trimws(cpp)))
          ld  <- rvtk::LdFlags()
          stopifnot(nzchar(trimws(ld)))
          ld_file <- rvtk::LdFlagsFile(tempfile(fileext = ".rsp"))
          stopifnot(nzchar(trimws(ld_file)))
          cat("VTK version:", v, "\n")

      # ── 11. Generate NAMESPACE and man/ from roxygen tags ─────────────────────
      #
      # Use roxygen2::roxygenise() with load_code = NULL so that the package is
      # NOT compiled at this stage.  All roxygen tags in rvtktest live in plain
      # R files (R/cpp11.R, R/rvtk_imports.R, R/rvtktest-package.R) and require
      # no runtime introspection — skipping compilation is safe here.  src/Makevars
      # is already in place from the attach step, so R CMD check (next) can
      # compile.  R CMD check runs tools/configure.R via Makevars to resolve flags.
      - name: Document downstream package
        shell: Rscript {0}
        run: roxygen2::roxygenise(Sys.getenv("PKG_DIR"), load_code = NULL)

      # ── 12. R CMD check + runtime smoke test ─────────────────────────────────
      - name: Check downstream package
        shell: Rscript {0}
        env:
          # Propagate VTK_DIR so that if configure re-resolves flags it still
          # finds the same VTK tree (relevant for built-shared).
          VTK_DIR: ${{ env.VTK_DIR }}
        run: |
          rcmdcheck::rcmdcheck(
            path   = Sys.getenv("PKG_DIR"),
            args   = c("--no-manual", "--no-vignettes", "--ignore-vignettes"),
            error_on = "error",
            check_dir = file.path(Sys.getenv("RUNNER_TEMP"), "check")
          )
          # Load the installed (checked) package and run the VTK smoke test.
          libs <- file.path(Sys.getenv("RUNNER_TEMP"), "check")
          ip <- installed.packages(lib.loc = libs)
          pkg_lib <- tempfile("smokelib")
          dir.create(pkg_lib)
          install.packages(
            Sys.getenv("PKG_DIR"),
            lib = pkg_lib,
            repos = NULL,
            type = "source"
          )
          stopifnot(require("rvtktest", lib.loc = pkg_lib, character.only = TRUE))
          val <- rvtktest::vtk_poly_data_npoints()
          cat("vtk_poly_data_npoints() =", val, "\n")
          stopifnot(identical(as.integer(val), 0L))
          # Cross-module probe: each class above lives in a different VTK module,
          # so a missing/ABI-broken module surfaces here as a load (`dlopen`)
          # failure or a runtime undefined symbol.
          ok <- rvtktest::vtk_modules_probe()
          cat("vtk_modules_probe() =", ok, "\n")
          stopifnot(identical(ok, TRUE))
